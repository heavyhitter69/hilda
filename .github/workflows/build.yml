name: Build Release Installers

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g. v1.0.0)
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Recommended for PyInstaller stability
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound2-dev

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI Dependencies
        working-directory: ./ui
        run: npm install

      - name: Resize App Icon
        run: |
          python -c "from PIL import Image; import os; os.makedirs('ui/build', exist_ok=True); img = Image.open('hilda-ai.png'); img.resize((512, 512), Image.Resampling.LANCZOS).save('ui/build/icon.png')"

      - name: Build Python Backend
        working-directory: ./ui
        run: npm run build:backend

      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: ./ui
        run: npm run build:website

      - name: Build Electron App (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: ./ui
        run: npm run build:mac

      - name: Build Electron App (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ./ui
        run: npm run build:linux

      - name: Cleanup before upload
        shell: bash
        run: |
          # Remove blockmap files to save space and reduce clutter
          rm -f website/downloads/*.blockmap
          # Ensure we don't have any unpacked directories in the upload path
          find website/downloads -maxdepth 1 -type d -name "*-unpacked" -exec rm -rf {} +
          # Show what we are about to upload
          ls -lh website/downloads/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hilda-Installers-${{ matrix.os }}
          path: |
            website/downloads/*.exe
            website/downloads/*.dmg
            website/downloads/*.deb
            website/downloads/*.rpm
            website/downloads/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts for release
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
